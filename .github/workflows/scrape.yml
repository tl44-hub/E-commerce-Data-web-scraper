name: Run scraper

on:
  workflow_dispatch:        # lets you press a Start button
  schedule:
    - cron: "0 6 * * *"     # also runs by itself every day

permissions:
  contents: write           # lets the robot save files into your repository

concurrency:
  group: scrape             # never run two at once

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install tools
        run: pip install -r requirements.txt

      - name: Run the scraper
        run: python main.py
        env:
          SCRAPER_API_KEY: ${{ secrets.SCRAPER_API_KEY }}

      - name: Make the spreadsheets
        if: always()
        continue-on-error: true
        run: python export_csv.py

      - name: Save history to the repository
        if: always()
        run: |
          mkdir -p data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --staged --quiet || git commit -m "Update scrape data $(date -u +%F)"
          git push

      - name: Keep a copy as a download too
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results
          path: |
            data/*.csv
            products.db*
